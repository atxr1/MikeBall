<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sprite sheet</title>
<style>
  body { margin: 0; background: #3f8a3a; }
  canvas { image-rendering: pixelated; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  import { TEAMS, setTeams } from '../src/data/teams.js';
  import { fromLeagueJson } from '../src/data/realleague.js';
  const real = await fetch('../assets/data/league.json').then((r) => r.json()).then(fromLeagueJson);
  setTeams(real.teams);
  import { uniform, drawSprite, drawShadow, drawCarriedBall, SW, SH, AX } from '../src/render/pixelsprites.js';
  const teams = (new URLSearchParams(location.search).get('teams') || 'KC,BUF,MIN,PIT').split(',');
  const views = ['S', 'N', 'E', 'W'];
  const rows = [];
  for (const id of teams) {
    const t = TEAMS.find((x) => x.id === id);
    for (const home of [true, false]) rows.push({ uni: uniform(t, home), num: home ? 15 : 7 });
  }
  const cols = [];
  const set = new URLSearchParams(location.search).get('set');
  if (set === 'moves') {
    for (const [v, pose] of [['S', 'cheer'], ['N', 'cheer'], ['E', 'cheer'], ['N', 'stiffL'], ['N', 'stiffR'], ['S', 'stiffL'], ['E', 'stiffL'], ['W', 'stiffR'],
      ['N', 'reel'], ['S', 'reel'], ['E', 'reel'], ['N', 'cutL'], ['N', 'cutR'], ['S', 'cutL'], ['E', 'cutL'], ['N', 'down'], ['S', 'down'], ['E', 'down'], ['W', 'dive'], ['E', 'push']]) {
      cols.push({ view: v, pose, frame: 0, ball: pose.startsWith('stiff') || pose.startsWith('cut') });
    }
  } else for (const v of views) {
    cols.push({ view: v, pose: 'stand', frame: 0 });
    for (let f = 0; f < 4; f++) cols.push({ view: v, pose: 'run', frame: f });
  }
  if (set !== 'moves') cols.push({ view: 'S', pose: 'throw', frame: 0 });
  cols.push({ view: 'N', pose: 'push', frame: 0 });
  cols.push({ view: 'S', pose: 'push', frame: 0 });
  cols.push({ view: 'E', pose: 'down', frame: 0 });
  cols.push({ view: 'E', pose: 'dive', frame: 0 });
  cols.push({ view: 'S', pose: 'carry', frame: 1, ball: true });
  // wait for helmet logos so side views show them (asset paths are relative
  // to the game page, one folder up from here)
  const { image } = await import('../src/render/images.js');
  for (const r of rows) if (r.uni.decal) r.uni.decal = `../${r.uni.decal}`;
  await Promise.all(rows.map((r) => r.uni.decal && new Promise((res) => {
    const i = image(r.uni.decal);
    if (i.complete) res();
    else { i.addEventListener('load', res); i.addEventListener('error', res); }
  })));
  const cw = SW + 4;
  const ch = SH + 4;
  const lo = document.createElement('canvas');
  lo.width = cols.length * cw;
  lo.height = rows.length * ch;
  const ctx = lo.getContext('2d');
  ctx.fillStyle = '#3f8a3a';
  ctx.fillRect(0, 0, lo.width, lo.height);
  rows.forEach((r, ri) => cols.forEach((c, ci) => {
    const x = ci * cw + AX + 2;
    const y = ri * ch + 26;
    drawShadow(ctx, x, y);
    drawSprite(ctx, r.uni, { ...c, num: r.num, skin: (ri + ci) % 6 }, x, y);
    if (c.ball) drawCarriedBall(ctx, c.view, x, y);
  }));
  const out = document.getElementById('c');
  const S = Number(new URLSearchParams(location.search).get('scale') || 5);
  out.width = lo.width * S;
  out.height = lo.height * S;
  const o = out.getContext('2d');
  o.imageSmoothingEnabled = false;
  o.drawImage(lo, 0, 0, out.width, out.height);
  document.title = 'ready';
</script>
</body>
</html>
